  <!-- Simple info lines -->
  <path d="M308 206H352"
        stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  <path d="M308 256H352"
        stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  <path d="M308 306H340"
