<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Employee icon - alternate clean ID/profile style -->
  <rect width="512" height="512" rx="112" fill="#12B886"/>

  <!-- ID card outline -->
  <rect x="118" y="120" width="276" height="272" rx="42"
        stroke="#FFFFFF" stroke-width="28" fill="none"/>

  <!-- Employee head -->
  <circle cx="214" cy="222" r="38"
          stroke="#FFFFFF" stroke-width="24" fill="none"/>

  <!-- Employee shoulders -->
